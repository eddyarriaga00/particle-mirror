<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Particle Mirror</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mirror">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-180.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    position: fixed; inset: 0; overflow: hidden;
    background: #000; color: #fff;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #gl {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none;
  }
  #cam { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* Start screen */
  #start {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center;
    padding: calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 24px);
    background: radial-gradient(120% 80% at 50% 35%, #1b1140 0%, #05030d 60%, #000 100%);
    transition: opacity .45s ease;
  }
  #start.hidden { opacity: 0; pointer-events: none; }
  #start h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  #start p { margin: 0 0 10px; max-width: 30ch; color: #b9b4d6; }
  #start .msg { min-height: 1.4em; color: #ffb4a8; font-size: 14px; max-width: 34ch; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  #go {
    min-height: 54px; padding: 0 34px; border-radius: 27px;
    font-weight: 600; font-size: 17px; color: #0a0618;
    background: linear-gradient(135deg, #7df9ff, #b48cff 55%, #ff7ad9);
  }
  #go:active { transform: scale(.97); }
  #demo { min-height: 44px; padding: 0 18px; background: none; color: #8f8ab0; font-size: 15px; }

  /* Controls */
  #bar {
    position: fixed; z-index: 2; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 18px);
    display: flex; justify-content: center; gap: 16px;
    pointer-events: none;
  }
  #bar button {
    pointer-events: auto;
    width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255,255,255,.1);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.14);
  }
  #bar button:active { background: rgba(255,255,255,.22); }
  #bar svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #toast, #hint {
    position: fixed; z-index: 2; left: 50%; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 20px; font-size: 14px; white-space: nowrap;
    background: rgba(0,0,0,.45);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    opacity: 0; transition: opacity .35s ease; pointer-events: none;
  }
  #toast { top: calc(env(safe-area-inset-top) + 18px); font-weight: 600; }
  #hint { bottom: calc(env(safe-area-inset-bottom) + 88px); color: #d6d2ee; }
  .show { opacity: 1 !important; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #start { transition: none; } }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <video id="cam" playsinline webkit-playsinline muted autoplay></video>

  <div id="start">
    <h1>Particle Mirror</h1>
    <p>See yourself as thousands of glowing particles. Drag to scatter them.</p>
    <button id="go">Start camera</button>
    <button id="demo">Try without camera</button>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <div id="toast" role="status"></div>
  <div id="hint">Drag to scatter · double-tap to explode</div>

  <div id="bar" hidden>
    <button id="style" aria-label="Change colour style">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="15.5" cy="10" r="1"/><path d="M12 21c-1.5 0-2-1-2-2s1-1.5 2-1.5h2.5A3.5 3.5 0 0 0 18 14"/></svg>
    </button>
    <button id="flip" aria-label="Switch camera">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><path d="M9.5 13.5a2.5 2.5 0 0 1 4.6-1.3M14.5 13.5a2.5 2.5 0 0 1-4.6 1.3"/><path d="M14.3 10.6v1.7h-1.7M9.7 16.4v-1.7h1.7"/></svg>
    </button>
  </div>

  <script src="main.js"></script>
</body>
</html>
