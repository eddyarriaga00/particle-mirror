<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pocket Galaxy</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Galaxy">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-180.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    position: fixed; inset: 0; overflow: hidden;
    background: #000; color: #fff;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #head {
    position: fixed; z-index: 2; left: 0; right: 0;
    top: calc(env(safe-area-inset-top) + 14px);
    text-align: center; pointer-events: none;
    text-shadow: 0 1px 12px #000;
  }
  #head h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; }
  #stats { font-size: 13px; color: #a9a6c9; min-height: 1.4em; }

  #labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .label {
    position: absolute; left: 0; top: 0; will-change: transform, opacity; opacity: 0; transition: opacity .25s ease;
    font-size: 11px; font-weight: 600; white-space: nowrap; color: #e6e4ff;
    text-shadow: 0 0 6px #000, 0 0 2px #000;
    max-width: 44vw; overflow: hidden; text-overflow: ellipsis;
  }
  #ring {
    position: fixed; left: 0; top: 0; z-index: 1; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85);
    box-shadow: 0 0 14px rgba(160,190,255,.7); pointer-events: none; opacity: 0;
    will-change: transform;
  }

  #hint {
    position: fixed; z-index: 2; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 26px);
    padding: 8px 16px; border-radius: 20px; font-size: 14px; white-space: nowrap; color: #d6d2ee;
    background: rgba(0,0,0,.45);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    opacity: 0; transition: opacity .35s ease; pointer-events: none;
  }
  #hint.show { opacity: 1; }

  /* Star details */
  #card {
    position: fixed; z-index: 3; left: 12px; right: 12px;
    bottom: calc(env(safe-area-inset-bottom) + 12px);
    max-width: 460px; margin: 0 auto;
    padding: 16px 16px 14px; border-radius: 22px;
    background: rgba(22,20,40,.72);
    -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
    border: 1px solid rgba(255,255,255,.12);
    transform: translateY(calc(100% + 40px)); transition: transform .32s cubic-bezier(.2,.8,.2,1);
    -webkit-user-select: text; user-select: text;
  }
  #card.open { transform: none; }
  #kind { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #a9a6c9; }
  #dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #title { margin: 6px 44px 2px 0; font-size: 19px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  #sub { font-size: 13px; color: #a9a6c9; }
  #body { margin-top: 8px; font-size: 15px; color: #dddaf2; overflow-wrap: anywhere; }
  #body:empty { display: none; }
  #open {
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 14px; min-height: 44px; padding: 0 20px; border-radius: 22px;
    font-weight: 600; font-size: 15px; color: #0a0618; text-decoration: none;
    background: linear-gradient(135deg, #7df9ff, #b48cff 55%, #ff7ad9);
  }
  #close {
    position: absolute; top: 8px; right: 8px; width: 44px; height: 44px;
    border: 0; border-radius: 50%; background: none; color: #c9c6e6; font-size: 22px; line-height: 1; cursor: pointer;
  }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #card { transition: none; } }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="labels"></div>
  <div id="ring"></div>

  <div id="head">
    <h1>Pocket Galaxy</h1>
    <div id="stats" role="status">Loading stars…</div>
  </div>

  <div id="hint">Drag to spin · pinch to zoom · tap a star</div>

  <div id="card" aria-live="polite">
    <button id="close" aria-label="Close">×</button>
    <div id="kind"><span id="dot"></span><span id="kindText"></span></div>
    <div id="title"></div>
    <div id="sub"></div>
    <div id="body"></div>
    <a id="open" target="_blank" rel="noopener">Open on GitHub</a>
  </div>

  <script src="main.js"></script>
</body>
</html>
